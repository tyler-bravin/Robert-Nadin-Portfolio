<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robert Nadin — Portfolio</title>
    <meta name="description" content="Robert Nadin — Software Developer, BSc (Hons) Software Development with Cyber Security, First Class Honours, University of Stirling." />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#101215" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, etc.) -->
    <!-- __SITE_URL__ is resolved at build time in vite.config.js — it
         auto-detects the Vercel deployment domain (production or preview),
         or falls back to a VITE_SITE_URL env var for other hosts. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Robert Nadin — Portfolio" />
    <meta property="og:description" content="Software Developer, BSc (Hons) Software Development with Cyber Security, First Class Honours, University of Stirling." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Robert Nadin — Portfolio" />
    <meta name="twitter:description" content="Software Developer, BSc (Hons) Software Development with Cyber Security, First Class Honours, University of Stirling." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
